<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="lotusGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff4b8b"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGrad)" stroke="#10A37F" stroke-width="2"/>

  <!-- Stars -->
  <circle cx="25" cy="20" r="1" fill="#ffffff" opacity="0.8"/>
  <circle cx="75" cy="22" r="1.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="85" cy="45" r="1" fill="#ffffff" opacity="0.7"/>
  <circle cx="15" cy="55" r="1.2" fill="#ffffff" opacity="0.8"/>
  <circle cx="35" cy="80" r="1" fill="#ffffff" opacity="0.6"/>

  <!-- Outer Lotus Petals -->
  <path d="M 50 25 C 30 45, 15 65, 50 82 C 85 65, 70 45, 50 25 Z" fill="url(#lotusGrad)" opacity="0.9"/>
  <path d="M 50 30 C 20 50, 10 70, 50 85 C 90 70, 80 50, 50 30 Z" fill="url(#lotusGrad)" opacity="0.75"/>

  <!-- Inner Petals -->
  <path d="M 50 35 C 35 55, 25 72, 50 84 C 75 72, 65 55, 50 35 Z" fill="#f472b6"/>
  <path d="M 50 42 C 40 60, 32 75, 50 84 C 68 75, 60 60, 50 42 Z" fill="#fb7185"/>

  <!-- Golden Divine Center Glow -->
  <ellipse cx="50" cy="80" rx="8" ry="4" fill="url(#glowGrad)"/>
  <circle cx="50" cy="78" r="3" fill="#ffffff"/>
</svg>
