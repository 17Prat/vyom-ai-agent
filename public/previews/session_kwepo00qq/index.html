<!DOCTYPE html>
<html>
<head>
	<title>Sagar ke Kinare Naag</title>
	<style>
		body {
			background-color: #87CEEB; /* Sky blue */
		}
		.naag {
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			width: 200px;
			height: 200px;
			background-color: #008000; /* Green */
			border-radius: 50%;
		}
		.sapere {
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			width: 100px;
			height: 100px;
			background-color: #FFFF00; /* Yellow */
			border-radius: 50%;
		}
	</style>
</head>
<body>
	<div class="naag"></div>
	<div class="sapere"></div>
</body>
</html>
