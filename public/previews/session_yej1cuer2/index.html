<!DOCTYPE html>
<html>
<head>
	<title>Ram Mandir Image</title>
	<style>
		body {
			background-color: #f2f2f2;
		}
		.mandir {
			width: 800px;
			height: 600px;
			background-color: #fff;
			border: 1px solid #ddd;
			padding: 20px;
		}
		.shikhar {
			width: 200px;
			height: 200px;
			background-color: #ccc;
			border-radius: 50%;
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
		}
		.shikhar img {
			width: 100%;
			height: 100%;
			object-fit: cover;
		}
	</style>
</head>
<body>
	<div class="mandir">
		<div class="shikhar">
			<img src="https://i.imgur.com/6Q4xK6d.png" alt="Shikhar Image">
		</div>
	</div>
</body>
</html>
